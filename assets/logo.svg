<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The spinning top of the overview video's closing shot (thin stem, wide disc, short cone to the point), tilted
       as it precesses; steel lit from the upper left, the rim in the cradle's teal. -->
  <defs>
    <linearGradient id="under" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c3cdcb"/><stop offset=".45" stop-color="#7b8886"/><stop offset="1" stop-color="#2f3a39"/>
    </linearGradient>
    <linearGradient id="face" x1="0" x2=".8" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#ccd5d3"/><stop offset="1" stop-color="#8e9a98"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e3e9e7"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".6" stop-color="#8e9a98"/><stop offset="1" stop-color="#3d4847"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5cc7ab"/><stop offset=".5" stop-color="#2fa58a"/><stop offset="1" stop-color="#17614f"/>
    </linearGradient>
  </defs>
  <ellipse cx="28" cy="60.5" rx="9" ry="1.7" fill="#0b1a1c" opacity=".22"/>
  <g transform="rotate(10 32 33)" stroke="#14262a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M6 34 C10 44 26 46 32 58 C38 46 54 44 58 34 Z" fill="url(#under)"/>
    <path d="M6 30 V34 A26 7.5 0 0 0 58 34 V30 A26 7.5 0 0 1 6 30 Z" fill="url(#rim)"/>
    <ellipse cx="32" cy="30" rx="26" ry="7.5" fill="url(#face)"/>
    <path d="M25 30.6 C29.6 29.6 30.3 25 30.6 17 L31 6.2 Q32 3.6 33 6.2 L33.4 17 C33.7 25 34.4 29.6 39 30.6 A7 2.1 0 0 1 25 30.6 Z" fill="url(#stem)"/>
  </g>
</svg>
